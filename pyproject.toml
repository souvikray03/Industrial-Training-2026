[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-compliance-auditor"
version = "0.1.0"
description = "Read-only GCP IAM, service-account key, and Cloud Storage compliance auditor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "GCP Compliance Auditor Contributors"}
]
keywords = ["gcp", "iam", "compliance", "least-privilege", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
gcp = [
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.33,<3",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
gcp-compliance-auditor = "gcp_compliance_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gcp_compliance_auditor*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gcp_compliance_auditor"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
